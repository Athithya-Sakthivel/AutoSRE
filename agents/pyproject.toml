[project]
name = "autosre-agent"
version = "0.1.4"
description = "Autonomous SRE Investigation & Remediation Engine"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [
    { name = "Athithya", email = "athithya651@gmail.com" }
]

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "litellm>=1.102.1",
    "tiktoken>=0.14.0",
    "kr8s>=0.20.15",
    "redis[hiredis]>=8.1.0",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "sqlalchemy[asyncio]>=2.0.54",
    "alembic>=1.20.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-psycopg>=0.65b0",
    "openinference-instrumentation-litellm>=0.1.46",
    "openinference-instrumentation-langchain>=0.1.76",
    "openinference-semantic-conventions>=0.1.39",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "testcontainers[postgres,redis]>=4.15.0",
    "deepeval>=4.2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autosre"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["autosre"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "eval"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "kr8s.*",
    "litellm.*",
    "openinference.*",
    "testcontainers.*",
    "deepeval.*",
    "redis.*",
]
ignore_missing_imports = true
