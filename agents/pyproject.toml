[project]
name = "autosre-agent"
version = "0.1.0"
description = "Autonomous SRE Investigation & Remediation Engine"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [
    { name = "Athithya", email = "athithya651@gmail.com" }
]

# ---------------------------------------------------------------------------
# Runtime Dependencies
# ---------------------------------------------------------------------------
dependencies = [
    # --- Web & API ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",

    # --- Orchestration & State ---
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",

    # --- LLM Routing & Context ---
    "litellm>=1.55",
    "tiktoken>=0.8",

    # --- Infrastructure Interaction ---
    "kr8s>=0.20",
    "redis[hiredis]>=5.0",
    "httpx>=0.27",

    # --- Database ---
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",

    # --- Data Processing (CodeAct Sandbox) ---
    "numpy==2.5.3",
    "pandas==3.0.6",

    # --- Observability ---
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-psycopg>=0.48b0",
    "openinference-instrumentation-litellm>=0.1.45",
    "openinference-instrumentation-langchain>=0.1.30",
    "openinference-semantic-conventions>=0.1.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "testcontainers[postgres,redis]>=4.8",
    "deepeval>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autosre"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["autosre"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "eval"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "kr8s.*",
    "litellm.*",
    "openinference.*",
    "testcontainers.*",
    "deepeval.*",
    "redis.*",
]
ignore_missing_imports = true
