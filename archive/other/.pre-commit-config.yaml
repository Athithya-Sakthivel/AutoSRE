repos:
  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  # Repository hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  # Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253 # v0.16.10
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^agents/.*\.py$

      - id: ruff-format
        files: ^agents/.*\.py$

  # Python type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 7ff8d35ae36a7d2b968f2f90b4c723e292e594ee # v2.3.1
    hooks:
      - id: mypy
        files: ^agents/.*\.py$

  # Frontend checks
  - repo: local
    hooks:
      - id: eslint-agents-ui
        name: ESLint (agents/ui)
        entry: npm --prefix agents/ui exec -- eslint --max-warnings 0
        language: system
        files: ^agents/ui/src/.*\.(js|jsx|ts|tsx)$
        pass_filenames: true

      - id: prettier-agents-ui
        name: Prettier (agents/ui)
        entry: npm --prefix agents/ui exec -- prettier --check
        language: system
        files: ^agents/ui/src/.*\.(js|jsx|ts|tsx|css|scss|md)$
        pass_filenames: true
