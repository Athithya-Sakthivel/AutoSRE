name: full_repo_security_scan

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: full-repo-security-scan-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TRIVY_VERSION: v0.74.0
  TRIVY_SEVERITY: CRITICAL

  GITLEAKS_VERSION: v8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

  MAVEN_PROJECT: rivulet/api-gateway/pom.xml
  MAVEN_WRAPPER: rivulet/api-gateway/mvnw

jobs:
  scan_repository:
    name: Full Repository Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java and restore Maven cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            rivulet/api-gateway/pom.xml
            rivulet/api-gateway/.mvn/wrapper/maven-wrapper.properties

      - name: Populate local Maven repository
        run: |
          set -euo pipefail

          test -f "$MAVEN_PROJECT"
          test -x "$MAVEN_WRAPPER"

          echo "[INFO] Java:"
          java -version

          echo "[INFO] Maven:"
          "$MAVEN_WRAPPER" --version

          echo "[INFO] Resolving Maven dependencies into ~/.m2/repository"

          "$MAVEN_WRAPPER" \
            --batch-mode \
            --no-transfer-progress \
            --file "$MAVEN_PROJECT" \
            dependency:go-offline \
            dependency:resolve-plugins

      - name: Install Gitleaks
        run: |
          set -euo pipefail

          version="${GITLEAKS_VERSION#v}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          archive="$tmp_dir/gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${version}_linux_x64.tar.gz"

          echo "[INFO] Downloading Gitleaks ${GITLEAKS_VERSION}"

          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 300 \
            --output "$archive" \
            "$url"

          echo "[INFO] Verifying Gitleaks SHA-256"

          printf '%s  %s\n' \
            "$GITLEAKS_SHA256" \
            "$archive" \
            | sha256sum --check --status

          install -d -m 0755 "$RUNNER_TEMP/security-tools"

          tar \
            --extract \
            --gzip \
            --file "$archive" \
            --directory "$tmp_dir" \
            --no-same-owner

          install -m 0755 \
            "$tmp_dir/gitleaks" \
            "$RUNNER_TEMP/security-tools/gitleaks"

          echo "$RUNNER_TEMP/security-tools" >> "$GITHUB_PATH"

          gitleaks version

      - name: Run Gitleaks full Git history scan
        id: gitleaks
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " Gitleaks - Full Git History"
          echo "============================================================"

          args=(
            git
            .
            --log-opts="--all --full-history"
            --redact
            --no-banner
            --exit-code 1
          )

          if [[ -f .gitleaks.toml ]]; then
            echo "[INFO] Using custom Gitleaks config: .gitleaks.toml"
            args+=(--config .gitleaks.toml)
          else
            echo "[INFO] No .gitleaks.toml found; using built-in defaults."
          fi

          gitleaks "${args[@]}"

      - name: Run Trivy filesystem vulnerability and IaC scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_OFFLINE_SCAN: "true"
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          exit-code: "1"
          timeout: 15m
          cache: true
          skip-dirs: >-
            .git,
            **/.git,
            **/.repos,
            **/.venv,
            **/node_modules,
            **/target,
            **/dist,
            **/__pycache__,
            **/.pytest_cache,
            **/.mypy_cache,
            **/.ruff_cache,
            **/.terraform,

            # Source Helm templates are intentionally incomplete.
            # The deployments use scripts/*-deploy.sh,
            # which renders the required values.yaml at runtime.
            # Skip these charts to avoid Trivy Helm parser errors.
            infra/k8s/open-observe-minimal,
            infra/k8s/otel-daemonset,
            infra/k8s/otel-gateway

      - name: Evaluate security scan results
        if: ${{ always() }}
        run: |
          set -euo pipefail

          failed=0

          echo "============================================================"
          echo " Security Scan Summary"
          echo "============================================================"

          if [[ "${{ steps.gitleaks.outcome }}" == "success" ]]; then
            echo "[PASS] Gitleaks"
          else
            echo "[FAIL] Gitleaks reported findings or failed."
            failed=1
          fi

          if [[ "${{ steps.trivy.outcome }}" == "success" ]]; then
            echo "[PASS] Trivy"
          else
            echo "[FAIL] Trivy reported findings or failed."
            failed=1
          fi

          echo "============================================================"

          if [[ "$failed" -ne 0 ]]; then
            echo "[ERROR] One or more security scanners reported findings or failed."
            exit 1
          fi

          echo "[SUCCESS] Security scan completed with no blocking findings."
