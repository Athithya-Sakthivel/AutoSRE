name: full_repo_security_scan

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: full-repo-security-scan-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TRIVY_VERSION: v0.74.0
  TRIVY_SEVERITY: CRITICAL

  GITLEAKS_VERSION: v8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

  OPENGREP_VERSION: v1.22.0
  OPENGREP_SHA256: 45bcd58440e397ed52c50e953ccf5948909ea77087c9186fc7d277216f62e319

  REPO_ROOT: ${{ github.workspace }}

jobs:
  scan_repository:
    name: Full Repository Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Prepare Trivy cache
        id: trivy_cache
        run: |
          set -euo pipefail

          install -d -m 0700 "$RUNNER_TEMP/trivy-cache"

          echo "week=$(date -u +'%G-%V')" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy databases
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ env.TRIVY_VERSION }}-${{ runner.os }}-${{ steps.trivy_cache.outputs.week }}
          restore-keys: |
            trivy-db-${{ env.TRIVY_VERSION }}-${{ runner.os }}-

      - name: Install OpenGrep
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          binary="$tmp_dir/opengrep"
          url="https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"

          echo "[INFO] Downloading OpenGrep ${OPENGREP_VERSION}"

          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 300 \
            --output "$binary" \
            "$url"

          echo "[INFO] Verifying OpenGrep SHA-256"

          printf '%s  %s\n' \
            "$OPENGREP_SHA256" \
            "$binary" \
            | sha256sum --check --status

          install -d -m 0755 "$RUNNER_TEMP/security-tools"

          install -m 0755 \
            "$binary" \
            "$RUNNER_TEMP/security-tools/opengrep"

          echo "$RUNNER_TEMP/security-tools" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/security-tools/opengrep" --version

      - name: Install Gitleaks
        run: |
          set -euo pipefail

          version="${GITLEAKS_VERSION#v}"

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          archive="$tmp_dir/gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${version}_linux_x64.tar.gz"

          echo "[INFO] Downloading Gitleaks ${GITLEAKS_VERSION}"

          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 300 \
            --output "$archive" \
            "$url"

          echo "[INFO] Verifying Gitleaks SHA-256"

          printf '%s  %s\n' \
            "$GITLEAKS_SHA256" \
            "$archive" \
            | sha256sum --check --status

          install -d -m 0755 "$RUNNER_TEMP/security-tools"

          tar \
            --extract \
            --gzip \
            --file "$archive" \
            --directory "$tmp_dir" \
            --no-same-owner

          test -f "$tmp_dir/gitleaks"

          install -m 0755 \
            "$tmp_dir/gitleaks" \
            "$RUNNER_TEMP/security-tools/gitleaks"

          echo "$RUNNER_TEMP/security-tools" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/security-tools/gitleaks" version

      - name: Run security scanners
        run: |
          set -uo pipefail

          cd "$REPO_ROOT"

          scan_status=0

          echo
          echo "============================================================"
          echo " OpenGrep SAST"
          echo "============================================================"

          opengrep_args=(
            scan
            --config p/owasp-top-ten
            --config p/dockerfile
            --config p/secrets
            --config p/kubernetes
            --error
            --max-target-bytes 2000000

            --exclude .git
            --exclude .repos
            --exclude .venv
            --exclude node_modules
            --exclude target
            --exclude dist
            --exclude __pycache__
            --exclude .pytest_cache
            --exclude .mypy_cache
            --exclude .ruff_cache
            --exclude .terraform

            .
          )

          if ! opengrep "${opengrep_args[@]}"; then
            echo "[ERROR] OpenGrep reported findings or failed."
            scan_status=1
          fi

          echo
          echo "============================================================"
          echo " Gitleaks - Full Git History"
          echo "============================================================"

          gitleaks_args=(
            git
            --redact
            --exit-code 1
            --log-opts="--all --full-history"
          )

          if [[ -f .gitleaks.toml ]]; then
            echo "[INFO] Using custom Gitleaks config: .gitleaks.toml"
            gitleaks_args+=(--config .gitleaks.toml)
          else
            echo "[INFO] No .gitleaks.toml found; using Gitleaks defaults."
          fi

          if ! gitleaks "${gitleaks_args[@]}" .; then
            echo "[ERROR] Gitleaks reported findings or failed."
            scan_status=1
          fi

          echo
          echo "============================================================"
          echo " Trivy - Filesystem Vulnerability + IaC Scan"
          echo "============================================================"

          if ! trivy fs \
            --cache-dir "$RUNNER_TEMP/trivy-cache" \
            --ignorefile .trivyignore \
            --scanners vuln,misconfig \
            --severity "$TRIVY_SEVERITY" \
            --ignore-unfixed \
            --include-dev-deps \
            --timeout 15m \
            --skip-dirs '.git' \
            --skip-dirs '**/.git' \
            --skip-dirs '**/.repos' \
            --skip-dirs '**/.venv' \
            --skip-dirs '**/node_modules' \
            --skip-dirs '**/target' \
            --skip-dirs '**/dist' \
            --skip-dirs '**/__pycache__' \
            --skip-dirs '**/.pytest_cache' \
            --skip-dirs '**/.mypy_cache' \
            --skip-dirs '**/.ruff_cache' \
            --skip-dirs '**/.terraform' \
            --exit-code 1 \
            .; then
            echo "[ERROR] Trivy reported findings or failed."
            scan_status=1
          fi

          echo
          echo "============================================================"

          if [[ "$scan_status" -ne 0 ]]; then
            echo "[ERROR] One or more security scanners reported findings or failed."
            exit "$scan_status"
          fi

          echo "[SUCCESS] All security scanners completed with no blocking findings."
