name: full_repo_security_scan

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: full-repo-security-scan-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TRIVY_VERSION: v0.74.0
  TRIVY_SEVERITY: CRITICAL

  GITLEAKS_VERSION: v8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

  OPENGREP_VERSION: v1.22.0
  OPENGREP_SHA256: 45bcd58440e397ed52c50e953ccf5948909ea77087c9186fc7d277216f62e319

  REPO_ROOT: ${{ github.workspace }}

  # Prevent cache downloads from hanging indefinitely.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "5"

  # Trivy does not need the optional update/telemetry endpoint for CI.
  TRIVY_SKIP_VERSION_CHECK: "true"
  TRIVY_DISABLE_TELEMETRY: "true"

jobs:
  scan_repository:
    name: Full Repository Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java and restore Maven cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Populate Maven dependency cache for Trivy
        run: |
          set -euo pipefail

          cd "$REPO_ROOT"

          test -f rivulet/api-gateway/pom.xml
          test -f rivulet/api-gateway/mvnw

          echo "[INFO] Java version:"
          java -version

          echo "[INFO] Maven version:"
          bash rivulet/api-gateway/mvnw --version

          echo "[INFO] Resolving Maven dependencies into ~/.m2"
          echo "[INFO] This prevents Trivy from querying Maven Central during the scan."

          bash rivulet/api-gateway/mvnw \
            --batch-mode \
            --no-transfer-progress \
            --file rivulet/api-gateway/pom.xml \
            dependency:go-offline \
            dependency:resolve-plugins

      - name: Install OpenGrep
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          binary="$tmp_dir/opengrep"
          url="https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"

          echo "[INFO] Downloading OpenGrep ${OPENGREP_VERSION}"

          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 300 \
            --output "$binary" \
            "$url"

          echo "[INFO] Verifying OpenGrep SHA-256"

          printf '%s  %s\n' \
            "$OPENGREP_SHA256" \
            "$binary" \
            | sha256sum --check --status

          install -d -m 0755 "$RUNNER_TEMP/security-tools"

          install -m 0755 \
            "$binary" \
            "$RUNNER_TEMP/security-tools/opengrep"

          echo "$RUNNER_TEMP/security-tools" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/security-tools/opengrep" --version

      - name: Install Gitleaks
        run: |
          set -euo pipefail

          version="${GITLEAKS_VERSION#v}"

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          archive="$tmp_dir/gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${version}_linux_x64.tar.gz"

          echo "[INFO] Downloading Gitleaks ${GITLEAKS_VERSION}"

          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 300 \
            --output "$archive" \
            "$url"

          echo "[INFO] Verifying Gitleaks SHA-256"

          printf '%s  %s\n' \
            "$GITLEAKS_SHA256" \
            "$archive" \
            | sha256sum --check --status

          install -d -m 0755 "$RUNNER_TEMP/security-tools"

          tar \
            --extract \
            --gzip \
            --file "$archive" \
            --directory "$tmp_dir" \
            --no-same-owner

          test -f "$tmp_dir/gitleaks"

          install -m 0755 \
            "$tmp_dir/gitleaks" \
            "$RUNNER_TEMP/security-tools/gitleaks"

          echo "$RUNNER_TEMP/security-tools" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/security-tools/gitleaks" version

      - name: Run OpenGrep SAST
        id: opengrep
        continue-on-error: true
        run: |
          set -euo pipefail

          cd "$REPO_ROOT"

          echo "============================================================"
          echo " OpenGrep SAST"
          echo "============================================================"

          opengrep scan \
            --config p/owasp-top-ten \
            --config p/dockerfile \
            --config p/secrets \
            --config p/kubernetes \
            --error \
            --max-target-bytes 2000000 \
            --exclude .git \
            --exclude .repos \
            --exclude .venv \
            --exclude node_modules \
            --exclude target \
            --exclude dist \
            --exclude __pycache__ \
            --exclude .pytest_cache \
            --exclude .mypy_cache \
            --exclude .ruff_cache \
            --exclude .terraform \
            --exclude .cache \
            .

      - name: Run Gitleaks full Git history scan
        id: gitleaks
        continue-on-error: true
        run: |
          set -euo pipefail

          cd "$REPO_ROOT"

          echo "============================================================"
          echo " Gitleaks - Full Git History"
          echo "============================================================"

          gitleaks_args=(
            git
            --log-opts="--all --full-history"
            --redact
            --no-banner
            --exit-code 1
          )

          if [[ -f .gitleaks.toml ]]; then
            echo "[INFO] Using custom Gitleaks config: .gitleaks.toml"
            gitleaks_args+=(--config .gitleaks.toml)
          else
            echo "[INFO] No .gitleaks.toml found; using Gitleaks defaults."
          fi

          gitleaks "${gitleaks_args[@]}" .

      - name: Run Trivy filesystem vulnerability and IaC scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Critical for the Maven 429 problem:
          # Trivy must use the populated local ~/.m2 repository and must
          # not query Maven Central to resolve missing Java dependencies.
          TRIVY_OFFLINE_SCAN: "true"
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          timeout: 15m
          cache: true
          skip-dirs: >-
            .git,
            **/.git,
            **/.repos,
            **/.venv,
            **/node_modules,
            **/target,
            **/dist,
            **/__pycache__,
            **/.pytest_cache,
            **/.mypy_cache,
            **/.ruff_cache,
            **/.terraform,
            .cache

      - name: Evaluate scanner results
        if: ${{ always() }}
        run: |
          set -euo pipefail

          failed=0

          echo "============================================================"
          echo " Security Scan Summary"
          echo "============================================================"

          if [[ "${{ steps.opengrep.outcome }}" != "success" ]]; then
            echo "[FAIL] OpenGrep reported findings or failed."
            failed=1
          else
            echo "[PASS] OpenGrep"
          fi

          if [[ "${{ steps.gitleaks.outcome }}" != "success" ]]; then
            echo "[FAIL] Gitleaks reported findings or failed."
            failed=1
          else
            echo "[PASS] Gitleaks"
          fi

          if [[ "${{ steps.trivy.outcome }}" != "success" ]]; then
            echo "[FAIL] Trivy reported findings or failed."
            failed=1
          else
            echo "[PASS] Trivy"
          fi

          echo "============================================================"

          if [[ "$failed" -ne 0 ]]; then
            echo "[ERROR] One or more security scanners reported findings or failed."
            exit 1
          fi

          echo "[SUCCESS] All security scanners completed with no blocking findings."
