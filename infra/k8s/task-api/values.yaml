# ==============================================================================
# Task API Helm chart values
#
# Design decisions:
#   - Backend and frontend use Argo Rollouts (canary) instead of Deployments.
#   - Canary is disabled by default for first deployment; enable later.
#   - HPA is disabled by default; enable after canary promotion.
#   - Backend secrets come from External Secrets Operator (backend-secrets).
#   - PostgreSQL is disabled by default; enable for kind local development.
#   - App Insights sampling is 100% for dev; reduce in production.
# ==============================================================================

backend:
  enabled: true
  image:
    repository: acrtaskapistgf41930.azurecr.io/backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  serverPort: 8080
  otelServiceName: task-api-backend
  appInsightsSamplingPercentage: "100"
  otelResourceAttributes: ""
  canary:
    # Disable canary for initial deploy. Enable for subsequent releases.
    enabled: false
    initialPause: 30s      # unused in current step model; kept for reference
    k6Pause: 2m
    trafficPause: 2m       # unused in current step model; kept for reference
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    readiness:
      initialDelaySeconds: 15
      periodSeconds: 10
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 15
    startup:
      initialDelaySeconds: 30
      periodSeconds: 10

frontend:
  enabled: true
  image:
    repository: acrtaskapistgf41930.azurecr.io/frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  canary:
    enabled: false
    initialPause: 30s
    k6Pause: 1m
    trafficPause: 1m
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  probes:
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 15

postgres:
  enabled: false
  image:
    repository: postgres
    tag: "18.6-alpine"
    pullPolicy: IfNotPresent
  storage:
    size: 1Gi
  service:
    port: 5432
  env:
    POSTGRES_DB: taskdb
    POSTGRES_USER: ""          # ignored; provided via secret
    POSTGRES_PASSWORD: ""      # ignored; provided via secret

serviceAccount:
  create: true
  name: ""
  annotations: {}
