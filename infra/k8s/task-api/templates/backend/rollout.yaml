# ==============================================================================
# Backend Argo Rollout – canary with script-driven promotion (optional)
# ==============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "task-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas | default 2 }}
  revisionHistoryLimit: {{ .Values.backend.revisionHistoryLimit | default 3 }}
  progressDeadlineSeconds: {{ .Values.backend.progressDeadlineSeconds | default 600 }}
  selector:
    matchLabels:
      app: backend

  strategy:
    canary:
      canaryService: backend-canary
      stableService: backend-stable
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: backend-route
            namespace: {{ .Release.Namespace }}
      steps:
        {{- if .Values.backend.canary.enabled }}
        # Canary steps: 0% -> indefinite pause -> 10% -> indefinite pause -> 100%
        # The indefinite pauses are advanced by the external script via `promote`.
        - setWeight: 0
        - pause: {}
        - setWeight: 10
        - pause: {}
        - setWeight: 100
        {{- else }}
        # Stable mode: immediate 100% traffic
        - setWeight: 100
        {{- end }}

  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: {{ include "task-api.serviceAccountName" . }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.serverPort | default 8080 }}
              protocol: TCP

          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
            failureThreshold: 3
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
            failureThreshold: 3
            timeoutSeconds: 5

          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.startup.periodSeconds }}
            failureThreshold: 30
            timeoutSeconds: 3

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
