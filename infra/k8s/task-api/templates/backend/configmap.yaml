# ==============================================================================
# Backend ConfigMap – non-sensitive environment variables
# ==============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "task-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  OTEL_SERVICE_NAME: {{ .Values.backend.otelServiceName | quote }}
  SERVER_PORT: {{ .Values.backend.serverPort | default 8080 | quote }}
  APPLICATIONINSIGHTS_SAMPLING_PERCENTAGE: {{ .Values.backend.appInsightsSamplingPercentage | quote }}
  OTEL_RESOURCE_ATTRIBUTES: {{ .Values.backend.otelResourceAttributes | quote }}
