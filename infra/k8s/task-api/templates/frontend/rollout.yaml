# ==============================================================================
# Frontend Argo Rollout – canary with script-driven promotion
# ==============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "task-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas | default 2 }}
  revisionHistoryLimit: {{ .Values.frontend.revisionHistoryLimit | default 3 }}
  progressDeadlineSeconds: {{ .Values.frontend.progressDeadlineSeconds | default 600 }}
  selector:
    matchLabels:
      app: frontend

  strategy:
    canary:
      canaryService: frontend-canary
      stableService: frontend-stable
      trafficRouting:
        plugins:
          gatewayapi:
            httpRoute: frontend-route
            namespace: task-api
      steps:
        - setWeight: 0
        - pause:
            duration: {{ .Values.frontend.canary.initialPause | default "30s" }}
        # Indefinite pause – script promotes after k6 validation
        - pause: {}
        - setWeight: 10
        - pause:
            duration: {{ .Values.frontend.canary.trafficPause | default "1m" }}
        - setWeight: 100

  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: {{ include "task-api.serviceAccountName" . }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf

          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.frontend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.frontend.probes.readiness.periodSeconds }}
            failureThreshold: 3
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.frontend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.frontend.probes.liveness.periodSeconds }}
            failureThreshold: 3
            timeoutSeconds: 5

          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      volumes:
        - name: nginx-config
          configMap:
            name: frontend-config
