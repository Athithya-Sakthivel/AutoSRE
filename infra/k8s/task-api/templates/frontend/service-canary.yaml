# ==============================================================================
# Frontend Canary Service
# Always rendered – required by Argo Rollouts even when canary is disabled.
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: frontend-canary
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "task-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
    app.kubernetes.io/version: canary
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
