# ==============================================================================
# ServiceAccount
#
# Used by both backend and frontend Rollouts.
# On AKS, this SA can be annotated for Azure Workload Identity when
# `serviceAccount.annotations` are provided. On kind, it remains a plain SA.
# ==============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "task-api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "task-api.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
