{{- if .Values.enabled }}
{{- $storeName := required "store.name is required" .Values.store.name }}
{{- $kvURL     := required "keyVault.url is required" .Values.keyVault.url }}
{{- $tenantID  := required "keyVault.tenantId is required" .Values.keyVault.tenantId }}
{{- $mode      := required "auth.mode is required" .Values.auth.mode }}
{{- if not (or (eq $mode "ServicePrincipal") (eq $mode "WorkloadIdentity")) }}
{{- fail "auth.mode must be ServicePrincipal or WorkloadIdentity" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $storeName }}
  labels:
    {{- include "externalsecrets.labels" . | nindent 4 }}
spec:
  provider:
    azurekv:
      authType: {{ $mode }}
      vaultUrl: {{ $kvURL | quote }}
      tenantId: {{ $tenantID | quote }}
      {{- if eq $mode "ServicePrincipal" }}
      {{- $sp   := required "auth.servicePrincipal.existingSecret is required" .Values.auth.servicePrincipal.existingSecret }}
      {{- $spN  := required "auth.servicePrincipal.existingSecret.name is required" $sp.name }}
      {{- $spNs := required "auth.servicePrincipal.existingSecret.namespace is required" $sp.namespace }}
      {{- $spC  := required "auth.servicePrincipal.existingSecret.clientIdKey is required" $sp.clientIdKey }}
      {{- $spS  := required "auth.servicePrincipal.existingSecret.clientSecretKey is required" $sp.clientSecretKey }}
      authSecretRef:
        clientId:
          name: {{ $spN }}
          key: {{ $spC }}
          namespace: {{ $spNs }}
        clientSecret:
          name: {{ $spN }}
          key: {{ $spS }}
          namespace: {{ $spNs }}
      {{- else }}
      {{- $wi   := required "auth.workloadIdentity is required" .Values.auth.workloadIdentity }}
      {{- $wiSA := required "auth.workloadIdentity.serviceAccountName is required" $wi.serviceAccountName }}
      {{- $wiNs := required "auth.workloadIdentity.serviceAccountNamespace is required" $wi.serviceAccountNamespace }}
      serviceAccountRef:
        name: {{ $wiSA }}
        namespace: {{ $wiNs }}
      {{- end }}
{{- end }}
