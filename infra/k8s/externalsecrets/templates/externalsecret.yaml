{{- range $secret := .Values.secrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret.name }}
  namespace: {{ required "targetNamespace is required" $secret.targetNamespace }}
  labels:
    {{- include "externalsecrets.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $secret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $.Values.store.name }}
    kind: {{ ternary "ClusterSecretStore" "SecretStore" $.Values.store.clusterScope }}
  target:
    name: {{ $secret.name }}
    creationPolicy: Owner
  data:
    {{- range $item := $secret.data }}
    - secretKey: {{ $item.secretKey }}
      remoteRef:
        key: {{ $item.remoteRef }}
    {{- end }}
---
{{- end }}
