{{- if .Values.enabled }}
{{- $storeName := required "store.name is required" .Values.store.name }}
{{- range $s := .Values.secrets }}
{{- $name := required "secrets[].name is required" $s.name }}
{{- $ns   := required "secrets[].targetNamespace is required" $s.targetNamespace }}
{{- $data := required "secrets[].data must contain at least one entry" $s.data }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "externalsecrets.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $s.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ $storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ $name }}
    creationPolicy: {{ $s.creationPolicy | default "Owner" }}
    {{- with $s.template }}
    template:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  data:
    {{- range $d := $data }}
    {{- $sk := required "secrets[].data[].secretKey is required" $d.secretKey }}
    {{- $rk := required "secrets[].data[].remoteRef is required" $d.remoteRef }}
    - secretKey: {{ $sk }}
      remoteRef:
        key: {{ $rk }}
        {{- with $d.property }}
        property: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
