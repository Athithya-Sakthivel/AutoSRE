{{- $mode := .Values.auth.mode -}}
{{- $clusterScope := .Values.store.clusterScope -}}
{{- $kvUrl := required "keyVault.url is required" .Values.keyVault.url -}}

{{- if $clusterScope }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.store.name }}
  labels:
    {{- include "externalsecrets.labels" . | nindent 4 }}
spec:
  provider:
    azurekv:
      authType: {{ $mode }}
      vaultUrl: {{ $kvUrl }}
      {{- if eq $mode "ServicePrincipal" }}
      tenantId: {{ required "keyVault.tenantId is required for ServicePrincipal" .Values.keyVault.tenantId }}
      authSecretRef:
        clientId:
          name: {{ .Values.auth.servicePrincipal.secretName }}
          key: {{ .Values.auth.servicePrincipal.clientIdKey }}
          namespace: {{ .Values.auth.servicePrincipal.secretNamespace }}
        clientSecret:
          name: {{ .Values.auth.servicePrincipal.secretName }}
          key: {{ .Values.auth.servicePrincipal.clientSecretKey }}
          namespace: {{ .Values.auth.servicePrincipal.secretNamespace }}
      {{- else if eq $mode "WorkloadIdentity" }}
      {{- with .Values.keyVault.tenantId }}
      tenantId: {{ . }}
      {{- end }}
      serviceAccountRef:
        name: {{ .Values.auth.workloadIdentity.serviceAccountName }}
        namespace: {{ .Values.auth.workloadIdentity.serviceAccountNamespace }}
      {{- end }}

{{- else }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.store.name }}
  namespace: {{ include "externalsecrets.storeNamespace" . }}
  labels:
    {{- include "externalsecrets.labels" . | nindent 4 }}
spec:
  provider:
    azurekv:
      authType: {{ $mode }}
      vaultUrl: {{ $kvUrl }}
      {{- if eq $mode "ServicePrincipal" }}
      tenantId: {{ required "keyVault.tenantId is required for ServicePrincipal" .Values.keyVault.tenantId }}
      authSecretRef:
        clientId:
          name: {{ .Values.auth.servicePrincipal.secretName }}
          key: {{ .Values.auth.servicePrincipal.clientIdKey }}
        clientSecret:
          name: {{ .Values.auth.servicePrincipal.secretName }}
          key: {{ .Values.auth.servicePrincipal.clientSecretKey }}
      {{- else if eq $mode "WorkloadIdentity" }}
      {{- with .Values.keyVault.tenantId }}
      tenantId: {{ . }}
      {{- end }}
      serviceAccountRef:
        name: {{ .Values.auth.workloadIdentity.serviceAccountName }}
      {{- end }}
{{- end }}
