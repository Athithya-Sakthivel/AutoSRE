{{- if and
      .Values.enabled
      (eq .Values.auth.mode "WorkloadIdentity")
      .Values.auth.workloadIdentity.createServiceAccount
}}
{{- $saName := required
      "auth.workloadIdentity.serviceAccountName is required"
      .Values.auth.workloadIdentity.serviceAccountName
}}
{{- $saNs := required
      "auth.workloadIdentity.serviceAccountNamespace is required"
      .Values.auth.workloadIdentity.serviceAccountNamespace
}}
{{- $annotations := .Values.auth.workloadIdentity.annotations | default dict }}
{{- $clientID := required
      "auth.workloadIdentity.annotations['azure.workload.identity/client-id'] is required"
      (index $annotations "azure.workload.identity/client-id")
}}
{{- $tenantID := index $annotations "azure.workload.identity/tenant-id" }}
{{- if not $tenantID }}
{{- $tenantID = required "keyVault.tenantId is required when the tenant annotation is absent" .Values.keyVault.tenantId }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ $saNs }}
  labels:
    {{- include "externalsecrets.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ $clientID | quote }}
    azure.workload.identity/tenant-id: {{ $tenantID | quote }}
{{- end }}
