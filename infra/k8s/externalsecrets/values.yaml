# ==============================================================================
# External Secrets configuration — In-Cluster Kubernetes SecretStore
#
# This chart DOES NOT install:
#   - External Secrets Operator
#   - ESO CRDs
#
# Those are infrastructure/bootstrap concerns handled by
# scripts/create_all_secrets_kind.sh.
#
# Authentication mode:
#
#   Kubernetes (in-cluster)
#     All environments (kind staging + AKS production).
#     Reads from a single source Secret: eso-source/eso-source.
#     No cloud provider dependency. No Azure/GCP/AWS credentials needed.
#
# Source secret keys are defined in create_all_secrets_kind.sh.
# This file maps those keys to target Secrets in each namespace.
# ==============================================================================

enabled: true

namespace: external-secrets

nameOverride: ""

# ------------------------------------------------------------------------------
# Secret store
# ------------------------------------------------------------------------------

store:
  name: eso-k8s-store

  # Cluster-scoped because targets span multiple namespaces.
  clusterScope: true

  # Provider: in-cluster Kubernetes SecretStore.
  # Reads from eso-source/eso-source via ServiceAccount RBAC.
  provider: kubernetes
  remoteNamespace: eso-source
  serviceAccountName: eso-k8s-reader
  serviceAccountNamespace: external-secrets

# ------------------------------------------------------------------------------
# ExternalSecrets
#
# Each entry produces one ExternalSecret resource in the target namespace.
# remoteRef values MUST match keys in the eso-source Secret created by
# create_all_secrets_kind.sh.
# ------------------------------------------------------------------------------

secrets:

  # ==========================================================================
  # openobserve namespace
  # ==========================================================================

  - name: openobserve-auth
    targetNamespace: openobserve
    refreshInterval: 1h
    data:
      - secretKey: ZO_ROOT_USER_EMAIL
        remoteRef: OpenObserveRootEmail
      - secretKey: ZO_ROOT_USER_PASSWORD
        remoteRef: OpenObserveRootPassword
      - secretKey: OPENOBSERVE_AUTH
        remoteRef: OpenObserveBasicAuth

  - name: openobserve-storage
    targetNamespace: openobserve
    refreshInterval: 1h
    data:
      - secretKey: account-name
        remoteRef: OpenObserveStorageAccountName
      - secretKey: account-key
        remoteRef: OpenObserveStorageAccountKey

  - name: otel-gateway-token
    targetNamespace: openobserve
    refreshInterval: 1h
    data:
      - secretKey: token
        remoteRef: OtelGatewayToken
      - secretKey: otel-exporter-headers
        remoteRef: OtelGatewayExporterHeaders

  # ==========================================================================
  # rivulet namespace
  # ==========================================================================

  - name: postgres-rivulet-env
    targetNamespace: rivulet
    refreshInterval: 1h
    data:
      - secretKey: PGDATABASE
        remoteRef: PostgresAppDbName
      - secretKey: PGUSER
        remoteRef: PostgresAppUsername
      - secretKey: PGPASSWORD
        remoteRef: PostgresAppPassword

  - name: postgres-app
    targetNamespace: rivulet
    refreshInterval: 1h
    data:
      - secretKey: host
        remoteRef: PostgresAppHost
      - secretKey: port
        remoteRef: PostgresAppPort
      - secretKey: dbname
        remoteRef: PostgresAppDbName
      - secretKey: username
        remoteRef: PostgresAppUsername
      - secretKey: password
        remoteRef: PostgresAppPassword
      - secretKey: uri
        remoteRef: PostgresAppUri
      - secretKey: jdbc-uri
        remoteRef: PostgresAppJdbcUri
      - secretKey: pgpass
        remoteRef: PostgresAppPgpass

  - name: valkey-auth
    targetNamespace: rivulet
    refreshInterval: 1h
    data:
      - secretKey: password
        remoteRef: ValkeyPassword

  - name: otel-exporter-headers
    targetNamespace: rivulet
    refreshInterval: 1h
    data:
      - secretKey: otel-exporter-headers
        remoteRef: OtelGatewayExporterHeaders

  # ==========================================================================
  # sre namespace (AutoSRE Agent)
  # ==========================================================================

  - name: postgres-agent
    targetNamespace: sre
    refreshInterval: 1h
    data:
      - secretKey: POSTGRES_HOST
        remoteRef: PostgresAppHost
      - secretKey: POSTGRES_PORT
        remoteRef: PostgresAppPort
      - secretKey: POSTGRES_DB
        remoteRef: PostgresAppDbName
      - secretKey: POSTGRES_USER
        remoteRef: PostgresAppUsername
      - secretKey: POSTGRES_PASSWORD
        remoteRef: PostgresAppPassword
      - secretKey: POSTGRES_URI
        remoteRef: PostgresAppUri

  - name: openobserve-reader
    targetNamespace: sre
    refreshInterval: 1h
    data:
      - secretKey: email
        remoteRef: OpenObserveReaderEmail
      - secretKey: password
        remoteRef: OpenObserveReaderPassword
      - secretKey: url
        remoteRef: OpenObserveUrl

  - name: llm-credentials
    targetNamespace: sre
    refreshInterval: 1h
    data:
      - secretKey: LLM_API_KEY
        remoteRef: LlmApiKey
      - secretKey: LLM_BASE_URL
        remoteRef: LlmBaseUrl
      - secretKey: LLM_PROVIDER
        remoteRef: LlmProvider
      - secretKey: LLM_MODEL_COORDINATOR
        remoteRef: LlmModelCoordinator
      - secretKey: LLM_MODEL_WORKER
        remoteRef: LlmModelWorker
      - secretKey: LLM_MODEL_SYNTHESIZER
        remoteRef: LlmModelSynthesizer
      - secretKey: LLM_MODEL_SELF_CHECK
        remoteRef: LlmModelSelfCheck

  - name: autosre-agent-secrets
    targetNamespace: sre
    refreshInterval: 1h
    data:
      # LLM config (AUTOSRE_ prefixed for pydantic-settings)
      - secretKey: AUTOSRE_LLM__API_KEY
        remoteRef: AutosreLlmApiKey
      - secretKey: AUTOSRE_LLM__MODEL_COORDINATOR
        remoteRef: AutosreLlmModelCoordinator
      - secretKey: AUTOSRE_LLM__MODEL_WORKER
        remoteRef: AutosreLlmModelWorker
      - secretKey: AUTOSRE_LLM__FALLBACK_MODELS
        remoteRef: AutosreLlmFallbackModels
      - secretKey: AUTOSRE_LLM__BASE_URL
        remoteRef: AutosreLlmBaseUrl
      - secretKey: AUTOSRE_LLM__INPUT_COST_PER_1K_COORDINATOR
        remoteRef: AutosreLlmInputCostPer1kCoordinator
      - secretKey: AUTOSRE_LLM__OUTPUT_COST_PER_1K_COORDINATOR
        remoteRef: AutosreLlmOutputCostPer1kCoordinator
      - secretKey: AUTOSRE_LLM__INPUT_COST_PER_1K_WORKER
        remoteRef: AutosreLlmInputCostPer1kWorker
      - secretKey: AUTOSRE_LLM__OUTPUT_COST_PER_1K_WORKER
        remoteRef: AutosreLlmOutputCostPer1kWorker
      - secretKey: AUTOSRE_LLM__MAX_RETRIES
        remoteRef: AutosreLlmMaxRetries
      - secretKey: AUTOSRE_LLM__INITIAL_BACKOFF_SECONDS
        remoteRef: AutosreLlmInitialBackoffSeconds
      - secretKey: AUTOSRE_LLM__MAX_BACKOFF_SECONDS
        remoteRef: AutosreLlmMaxBackoffSeconds
      - secretKey: AUTOSRE_LLM__ABSOLUTE_BACKOFF_CAP_SECONDS
        remoteRef: AutosreLlmAbsoluteBackoffCapSeconds
      - secretKey: AUTOSRE_LLM__CIRCUIT_BREAKER_ENABLED
        remoteRef: AutosreLlmCircuitBreakerEnabled
      - secretKey: AUTOSRE_LLM__CIRCUIT_BREAKER_THRESHOLD
        remoteRef: AutosreLlmCircuitBreakerThreshold
      - secretKey: AUTOSRE_LLM__CIRCUIT_BREAKER_TIMEOUT_SECONDS
        remoteRef: AutosreLlmCircuitBreakerTimeoutSeconds
      # Postgres
      - secretKey: AUTOSRE_POSTGRES__HOST
        remoteRef: AutosrePostgresHost
      - secretKey: AUTOSRE_POSTGRES__PORT
        remoteRef: AutosrePostgresPort
      - secretKey: AUTOSRE_POSTGRES__DB
        remoteRef: AutosrePostgresDb
      - secretKey: AUTOSRE_POSTGRES__USER
        remoteRef: AutosrePostgresUser
      - secretKey: AUTOSRE_POSTGRES__PASSWORD
        remoteRef: AutosrePostgresPassword
      # OpenObserve
      - secretKey: AUTOSRE_OPENOBSERVE__EMAIL
        remoteRef: AutosreOpenobserveEmail
      - secretKey: AUTOSRE_OPENOBSERVE__PASSWORD
        remoteRef: AutosreOpenobservePassword
      - secretKey: AUTOSRE_OPENOBSERVE__URL
        remoteRef: AutosreOpenobserveUrl
      # Alert webhook
      - secretKey: AUTOSRE_ALERT__WEBHOOK_SECRET
        remoteRef: AutosreAlertWebhookSecret
      # Admin
      - secretKey: AUTOSRE_ADMIN__SECRET
        remoteRef: AutosreAdminSecret
      # Slack (optional)
      - secretKey: AUTOSRE_SLACK__BOT_TOKEN
        remoteRef: AutosreSlackBotToken
      - secretKey: AUTOSRE_SLACK__APP_TOKEN
        remoteRef: AutosreSlackAppToken
      - secretKey: AUTOSRE_SLACK__SIGNING_SECRET
        remoteRef: AutosreSlackSigningSecret
      - secretKey: AUTOSRE_SLACK__MODE
        remoteRef: AutosreSlackMode
      - secretKey: AUTOSRE_SLACK__APPROVAL_CHANNEL
        remoteRef: AutosreSlackApprovalChannel
      - secretKey: AUTOSRE_SLACK__APPROVER_USER_IDS
        remoteRef: AutosreSlackApproverUserIds
      # Eval judge
      - secretKey: AUTOSRE_EVAL__JUDGE_API_KEY
        remoteRef: AutosreEvalJudgeApiKey
      - secretKey: AUTOSRE_EVAL__JUDGE_MODEL
        remoteRef: AutosreEvalJudgeModel
      - secretKey: AUTOSRE_EVAL__JUDGE_BASE_URL
        remoteRef: AutosreEvalJudgeBaseUrl
      # Safety / graph budgets
      - secretKey: AUTOSRE_SAFETY__MAX_RISK_TIER_AUTONOMOUS
        remoteRef: AutosreSafetyMaxRiskTierAutonomous
      - secretKey: AUTOSRE_SAFETY__MAX_ACTIONS_PER_INCIDENT
        remoteRef: AutosreSafetyMaxActionsPerIncident
      - secretKey: AUTOSRE_SAFETY__MAX_WALL_CLOCK_SECONDS
        remoteRef: AutosreSafetyMaxWallClockSeconds
      - secretKey: AUTOSRE_SAFETY__INITIAL_ITERATION_BUDGET
        remoteRef: AutosreSafetyInitialIterationBudget
      - secretKey: AUTOSRE_SAFETY__STAGNATION_LIMIT
        remoteRef: AutosreSafetyStagnationLimit
      - secretKey: AUTOSRE_SAFETY__MAX_ACTION_ATTEMPTS
        remoteRef: AutosreSafetyMaxActionAttempts
      - secretKey: AUTOSRE_SAFETY__CONFIDENCE_PROPOSE
        remoteRef: AutosreSafetyConfidencePropose
      - secretKey: AUTOSRE_SAFETY__CONFIDENCE_FAST_PATH
        remoteRef: AutosreSafetyConfidenceFastPath
      - secretKey: AUTOSRE_SAFETY__CONFIDENCE_GIVE_UP
        remoteRef: AutosreSafetyConfidenceGiveUp
      - secretKey: AUTOSRE_SAFETY__MIN_CONFIDENCE_IMPROVEMENT
        remoteRef: AutosreSafetyMinConfidenceImprovement
      - secretKey: AUTOSRE_SAFETY__MAX_LLM_CALLS_PER_INCIDENT
        remoteRef: AutosreSafetyMaxLlmCallsPerIncident
      # OTel
      - secretKey: AUTOSRE_OTEL__EXPORTER_OTLP_ENDPOINT
        remoteRef: AutosreOtelExporterOtlpEndpoint
      - secretKey: AUTOSRE_OTEL__SERVICE_NAME
        remoteRef: AutosreOtelServiceName
      - secretKey: AUTOSRE_OTEL__DEPLOYMENT_ENVIRONMENT
        remoteRef: AutosreOtelDeploymentEnvironment
      - secretKey: AUTOSRE_OTEL__EXPORTER_HEADERS
        remoteRef: AutosreOtelExporterHeaders
      # Top-level
      - secretKey: AUTOSRE_DEPLOYMENT_ENVIRONMENT
        remoteRef: AutosreDeploymentEnvironment

  - name: otel-exporter-headers
    targetNamespace: sre
    refreshInterval: 1h
    data:
      - secretKey: otel-exporter-headers
        remoteRef: OtelGatewayExporterHeaders

  - name: alert-webhook
    targetNamespace: sre
    refreshInterval: 1h
    data:
      - secretKey: webhook-secret
        remoteRef: AlertWebhookSecret

  # ==========================================================================
  # eval namespace
  # ==========================================================================

  - name: openobserve-reader
    targetNamespace: eval
    refreshInterval: 1h
    data:
      - secretKey: email
        remoteRef: OpenObserveReaderEmail
      - secretKey: password
        remoteRef: OpenObserveReaderPassword

  - name: ground-truth-db
    targetNamespace: eval
    refreshInterval: 1h
    data:
      - secretKey: username
        remoteRef: GroundTruthDbUsername
      - secretKey: password
        remoteRef: GroundTruthDbPassword
      - secretKey: uri
        remoteRef: GroundTruthDbUri

  - name: sre-agent-api
    targetNamespace: eval
    refreshInterval: 1h
    data:
      - secretKey: url
        remoteRef: SreAgentApiUrl
