apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "otel-daemonset.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-daemonset.labels" . | nindent 4 }}

spec:
  selector:
    matchLabels:
      {{- include "otel-daemonset.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      annotations:
        # Any ConfigMap change produces a new pod template hash and therefore
        # forces the DaemonSet to restart with the new collector configuration.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}

        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      labels:
        {{- include "otel-daemonset.selectorLabels" . | nindent 8 }}

        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

    spec:
      serviceAccountName: {{ include "otel-daemonset.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}

      # Give the collector time to flush queued telemetry during shutdown.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:
        - name: collector

          image: {{ include "otel-daemonset.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}

          args:
            # Explicit configuration path used by the collector image.
            - --config=/etc/otelcol/config.yaml

          ports:
            # Health endpoint exposed for Kubernetes readiness/liveness probes.
            - name: health
              containerPort: 13133
              protocol: TCP

          env:
            # ------------------------------------------------------------------
            # Node identity
            # ------------------------------------------------------------------
            #
            # K8S_NODE_IP is consumed by kubelet_stats:
            #   https://${K8S_NODE_IP}:10250
            - name: K8S_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP

            # Retain the node name for diagnostics and future node-scoped
            # filtering.
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            # ------------------------------------------------------------------
            # OpenObserve authentication
            # ------------------------------------------------------------------
            #
            # OPENOBSERVE_AUTH is the ESO-provided base64(email:password)
            # credential. The collector uses it to construct the HTTP Basic
            # Authorization header in configmap.yaml.
            - name: OPENOBSERVE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openobserve.tokenSecret.name }}
                  key: {{ .Values.openobserve.tokenSecret.key }}

            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          # --------------------------------------------------------------------
          # Collector health probes
          # --------------------------------------------------------------------

          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            # The health_check extension serves "/" on port 13133.
            httpGet:
              path: /
              port: health
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}

          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            # Restart the collector if its health endpoint stops responding.
            httpGet:
              path: /
              port: health
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            # ------------------------------------------------------------------
            # Collector configuration
            # ------------------------------------------------------------------
            - name: config
              mountPath: /etc/otelcol
              readOnly: true

            # ------------------------------------------------------------------
            # Kubernetes pod logs
            # ------------------------------------------------------------------
            #
            # configmap.yaml reads:
            #   /var/log/pods/*/*/*.log
            #
            # This is a read-only hostPath mount. The collector never writes
            # back to the node's Kubernetes log directory.
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true

            # ------------------------------------------------------------------
            # Collector runtime/checkpoint storage
            # ------------------------------------------------------------------
            #
            # file_storage/filelog writes its checkpoints under:
            #   /tmp/otelcol-filelog
            #
            # /tmp is therefore intentionally writable even though the root
            # filesystem is read-only.
            - name: tmp
              mountPath: /tmp

            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

      volumes:
        # Rendered collector configuration.
        - name: config
          configMap:
            name: {{ include "otel-daemonset.fullname" . }}-config

        # ----------------------------------------------------------------------
        # Host Kubernetes pod logs
        # ----------------------------------------------------------------------
        #
        # This directly backs the file_log/kubernetes receiver.
        #
        # Host:
        #   /var/log/pods
        #
        # Container:
        #   /var/log/pods
        #
        # The type=Directory guard intentionally fails scheduling if the
        # expected node directory is absent rather than silently producing
        # an empty log pipeline.
        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: Directory

        # Writable collector runtime/checkpoint storage.
        - name: tmp
          emptyDir: {}

        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
