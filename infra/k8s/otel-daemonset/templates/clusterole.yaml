{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "otel-daemonset.fullname" . }}
  labels:
    {{- include "otel-daemonset.labels" . | nindent 4 }}
rules:
  # Required by kubelet_stats to read node stats and scrape the kubelet API.
  # The `nodes/proxy` permission is required for the `/stats/summary` endpoint
  # when using the DaemonSet pattern on some Kubernetes distributions.
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/stats
      - nodes/proxy
    verbs: ["get", "list", "watch"]
  # Required by kubelet_stats to resolve pod metadata when emitting
  # pod-level metrics with k8s.pod.name attributes.
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
    verbs: ["get", "list", "watch"]
{{- end }}
