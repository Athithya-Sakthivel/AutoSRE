apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: rivulet
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: rivulet
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: rivulet
        app.kubernetes.io/component: backend
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-datastores
          image: docker.io/library/busybox:1.37-musl
          command:
            - sh
            - -c
            - |
              set -eu
              wait_tcp() {
                host="$1"; port="$2"; label="$3"; i=0
                echo "waiting for ${label} ${host}:${port} ..."
                until timeout -k 2 3 nc -z -w 2 "${host}" "${port}" 2>/dev/null; do
                  i=$((i + 1))
                  echo "  [${label}] attempt ${i} failed, retrying in 2s..."
                  sleep 2
                done
                echo "${label} reachable"
              }
              wait_tcp "postgres.rivulet.svc.cluster.local" "5432" "postgres"
              wait_tcp "valkey.rivulet.svc.cluster.local" "6379" "valkey"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 32Mi }
      containers:
        - name: api-gateway
          image: ghcr.io/athithya-sakthivel/rivulet-api-gateway:latest
          imagePullPolicy: Always
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "production"
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: GIT_VERSION
              value: "latest"

            - name: PGHOST
              value: "postgres.rivulet.svc.cluster.local"
            - name: PGPORT
              value: "5432"
            - name: PGSSLMODE
              value: "disable"
            - name: PGDATABASE
              valueFrom: { secretKeyRef: { name: postgres-rivulet-env, key: PGDATABASE } }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: postgres-rivulet-env, key: PGUSER } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-rivulet-env, key: PGPASSWORD } }

            - name: VALKEY_HOST
              value: "valkey.rivulet.svc.cluster.local"
            - name: VALKEY_PORT
              value: "6379"
            - name: VALKEY_TLS_ENABLED
              value: "false"
            - name: VALKEY_PASSWORD
              valueFrom: { secretKeyRef: { name: valkey-auth, key: VALKEY_PASSWORD } }

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-gateway.openobserve.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: otel-exporter-headers
                  key: otel-exporter-headers
                  optional: true

            - name: STREAM_NAME
              value: "rivulet.orders.in"
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:MaxRAMPercentage=70
                -XX:InitialRAMPercentage=40
                -XX:+ExitOnOutOfMemoryError
                -XX:+UseSerialGC
                -Djava.security.egd=file:/dev/urandom
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 18
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
      volumes:
        - name: tmp
          emptyDir: {}
