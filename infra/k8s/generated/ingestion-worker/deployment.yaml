apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-worker
  namespace: rivulet
  labels:
    app.kubernetes.io/name: ingestion-worker
    app.kubernetes.io/part-of: rivulet
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion-worker
        app.kubernetes.io/part-of: rivulet
        app.kubernetes.io/component: backend
    spec:
      # Prevents kubelet's legacy Docker-link env injection (SVCNAME_PORT=tcp://...).
      # VALKEY_PORT=tcp://10.x.x.x:6379 would be read by config.Load and fail
      # to parse as int — worker exits 1 at startup.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-datastores
          image: docker.io/library/busybox:1.37-musl
          command:
            - sh
            - -c
            - |
              set -eu
              wait_tcp() {
                host="$1"; port="$2"; label="$3"; i=0
                echo "waiting for ${label} ${host}:${port} ..."
                until timeout -k 2 3 nc -z -w 2 "${host}" "${port}" 2>/dev/null; do
                  i=$((i + 1))
                  echo "  [${label}] attempt ${i} failed, retrying in 2s..."
                  sleep 2
                done
                echo "${label} reachable"
              }
              wait_tcp "postgres.rivulet.svc.cluster.local" "5432" "postgres"
              wait_tcp "valkey.rivulet.svc.cluster.local" "6379" "valkey"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 32Mi }
      containers:
        - name: ingestion-worker
          image: ghcr.io/athithya-sakthivel/rivulet-ingestion-worker:latest
          imagePullPolicy: Always
          env:
            # Service identity for telemetry
            - name: OTEL_SERVICE_NAME
              value: "ingestion-worker"
            - name: DEPLOYMENT_ENVIRONMENT
              value: "evaluation"
            - name: GIT_VERSION
              value: "latest"

            # HTTP + Chaos ports (config.Load reads these)
            - name: HTTP_PORT
              value: "8080"
            - name: CHAOS_PORT
              value: "8081"

            # Postgres — host/port/sslmode via env, credentials via secret
            - name: PGHOST
              value: "postgres.rivulet.svc.cluster.local"
            - name: PGPORT
              value: "5432"
            - name: PGSSLMODE
              value: "disable"
            - name: PGDATABASE
              valueFrom: { secretKeyRef: { name: postgres-rivulet-env, key: PGDATABASE } }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: postgres-rivulet-env, key: PGUSER } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-rivulet-env, key: PGPASSWORD } }

            # Valkey — explicit to override any SVCNAME_PORT injection
            - name: VALKEY_HOST
              value: "valkey.rivulet.svc.cluster.local"
            - name: VALKEY_PORT
              value: "6379"
            - name: VALKEY_TLS_ENABLED
              value: "false"
            - name: VALKEY_PASSWORD
              valueFrom: { secretKeyRef: { name: valkey-auth, key: VALKEY_PASSWORD } }

            # Stream / consumer group identity
            - name: STREAM_NAME
              value: "rivulet.orders.in"
            - name: CONSUMER_GROUP
              value: "ingestion-workers"

            # OTel — endpoint via env, exporter headers optional
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-gateway.openobserve.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: otel-exporter-headers
                  key: otel-exporter-headers
                  optional: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: chaos
              containerPort: 8081
              protocol: TCP
            # NOTE: chaos is not referenced by the Service — see service.yaml
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20    # 60s budget for initial ping + pool init
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
      volumes:
        - name: tmp
          emptyDir: {}
