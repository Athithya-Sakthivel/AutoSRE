{{- if .Values.networkPolicies.enabled }}
# =============================================================================
# Ingress on openobserve — who may query the HTTP API
# NOTE: pod uses `app.kubernetes.io/name: open-observe-minimal`
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openobserve-ingress
  namespace: {{ .Values.networkPolicies.openobserveNamespace }}
  labels:
    app.kubernetes.io/part-of: autosre-cilium
    app.kubernetes.io/component: network-policy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: open-observe-minimal
  ingress:
    # SRE Agent querying metrics/logs
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.sreNamespace }}
            app.kubernetes.io/name: autosre-agent
      toPorts:
        - ports:
            - port: "5080"
              protocol: TCP
    # Eval harness querying metrics/logs
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.evalNamespace }}
      toPorts:
        - ports:
            - port: "5080"
              protocol: TCP
    # External users (port-forward or Ingress to OpenObserve UI)
    - fromEntities:
        - host
        - remote-node
        - world
      toPorts:
        - ports:
            - port: "5080"
              protocol: TCP
    # kubelet probes
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "5080"
              protocol: TCP
---
# =============================================================================
# Ingress on autosre-agent — who may trigger incidents
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sre-agent-ingress
  namespace: {{ .Values.networkPolicies.sreNamespace }}
  labels:
    app.kubernetes.io/part-of: autosre-cilium
    app.kubernetes.io/component: network-policy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: autosre-agent
  ingress:
    # OpenObserve webhook alerts
    # NOTE: source pod uses `app.kubernetes.io/name: open-observe-minimal`
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.openobserveNamespace }}
            app.kubernetes.io/name: open-observe-minimal
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Eval harness triggering incidents
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.evalNamespace }}
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # External UI access (port-forward)
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
{{- end }}
