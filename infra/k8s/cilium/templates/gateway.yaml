{{- if .Values.gateway.createGatewayClass }}
{{- if not (lookup "gateway.networking.k8s.io/v1" "GatewayClass" "" .Values.gateway.className) }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gateway.className | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.gateway.className | quote }}
    app.kubernetes.io/part-of: cilium
spec:
  controllerName: {{ .Values.gateway.controllerName | quote }}
{{- end }}
{{- end }}

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name | quote }}
  namespace: {{ .Values.gateway.namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.gateway.name | quote }}
    app.kubernetes.io/part-of: cilium
spec:
  gatewayClassName: {{ .Values.gateway.className | quote }}
  listeners:
    {{- range .Values.gateway.listeners }}
    - name: {{ .name | quote }}
      protocol: {{ .protocol | quote }}
      port: {{ .port }}
      {{- with .hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      {{- with .allowedRoutes }}
      allowedRoutes:
{{ toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
