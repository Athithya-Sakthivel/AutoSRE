{{- if .Values.networkPolicies.enabled }}
# =============================================================================
# otel-daemonset → kubelet (host:10250) for kubelet_stats receiver
#
# The kubelet_stats receiver scrapes https://${K8S_NODE_IP}:10250/stats/summary
# to collect node/pod/container metrics. This traffic originates from the
# daemonset pod and targets the host network namespace where kubelet runs.
#
# Without this policy, the default-deny rule drops all traffic to the host
# entity, causing the kubelet_stats scraper to time out every collection
# interval.
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: otel-daemonset-to-kubelet
  namespace: {{ .Values.networkPolicies.openobserveNamespace }}
  labels:
    app.kubernetes.io/part-of: autosre-cilium
    app.kubernetes.io/component: network-policy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: otel-daemonset
  egress:
    # Kubelet API on host network namespace (port 10250)
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
{{- end }}
