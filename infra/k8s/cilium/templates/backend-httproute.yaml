{{- if .Values.routes.backend.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.routes.backend.name | quote }}
  namespace: {{ .Values.routes.backend.namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.routes.backend.name | quote }}
    app.kubernetes.io/part-of: task-api
spec:
  parentRefs:
    {{- range .Values.routes.backend.parentRefs }}
    - name: {{ .name | quote }}
      {{- with .namespace }}
      namespace: {{ . | quote }}
      {{- end }}
      {{- with .sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
    {{- end }}
  {{- with .Values.routes.backend.hostnames }}
  hostnames:
{{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- with .Values.routes.backend.matches }}
      matches:
{{ toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        {{- range .Values.routes.backend.backendRefs }}
        - name: {{ .name | quote }}
          kind: {{ default "Service" .kind | quote }}
          port: {{ .port }}
          weight: {{ .weight | default 1 }}
          {{- with .namespace }}
          namespace: {{ . | quote }}
          {{- end }}
        {{- end }}
{{- end }}
