{{- if .Values.networkPolicies.enabled }}
# =============================================================================
# Ingress on api-gateway — frontend, kubelet probes, eval chaos
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: api-gateway-ingress
  namespace: {{ .Values.networkPolicies.rivuletNamespace }}
  labels:
    app.kubernetes.io/part-of: autosre-cilium
    app.kubernetes.io/component: network-policy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  ingress:
    # Frontend → api-gateway :8080
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.rivuletNamespace }}
            app.kubernetes.io/name: frontend
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Eval harness → chaos plane :8081
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.evalNamespace }}
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # kubelet probes from host network namespace
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# =============================================================================
# Ingress on frontend — external users, kubelet probes, in-cluster pods
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: frontend-ingress
  namespace: {{ .Values.networkPolicies.rivuletNamespace }}
  labels:
    app.kubernetes.io/part-of: autosre-cilium
    app.kubernetes.io/component: network-policy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  ingress:
    # External users (port-forward or Ingress)
    - fromEntities:
        - host
        - remote-node
        - world
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # In-cluster pods within rivulet
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.rivuletNamespace }}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
{{- end }}
