{{- if .Values.networkPolicies.enabled }}
{{- range $ns := list .Values.networkPolicies.rivuletNamespace .Values.networkPolicies.sreNamespace .Values.networkPolicies.evalNamespace .Values.networkPolicies.openobserveNamespace }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: autosre-cilium
    app.kubernetes.io/component: network-policy
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            cilium.io/no-such-entity: "true"
  egress:
    - toEndpoints:
        - matchLabels:
            cilium.io/no-such-entity: "true"
---
{{- end }}
{{- end }}
