apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sre-agent-egress
  namespace: sre
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: autosre-agent
  egress:
    # kube-apiserver (with Kind CIDR fallback)
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toCIDR:
        - 172.18.0.0/16  # Kind Docker network range
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

    # 2. Postgres (for terminate_backend and state DB)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.rivuletNamespace }}
            app.kubernetes.io/name: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

    # 3. Valkey (for cache operations)
    #    CRITICAL: valkey pod uses `app: valkey`, NOT app.kubernetes.io/name
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.rivuletNamespace }}
            app: valkey
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP

    # 4. OpenObserve HTTP API (for log/metric queries)
    #    CRITICAL: pod uses `app.kubernetes.io/name: open-observe-minimal`
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.openobserveNamespace }}
            app.kubernetes.io/name: open-observe-minimal
      toPorts:
        - ports:
            - port: "5080"
              protocol: TCP

    # 5. OTel Gateway (for trace export)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.openobserveNamespace }}
            app.kubernetes.io/name: otel-gateway
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP

    # 6. External LLM provider (Gemini/Groq/etc)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
