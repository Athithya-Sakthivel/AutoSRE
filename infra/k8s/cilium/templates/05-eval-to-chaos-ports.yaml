{{- if .Values.networkPolicies.enabled }}
# =============================================================================
# Eval egress — chaos injection, agent API, openobserve, external LLM judge
# NOTE: chaos targets use `component: backend` to exclude frontend, postgres, valkey
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: eval-egress
  namespace: {{ .Values.networkPolicies.evalNamespace }}
  labels:
    app.kubernetes.io/part-of: autosre-cilium
    app.kubernetes.io/component: network-policy
spec:
  endpointSelector: {}
  egress:
    # Chaos injection ports (:8081) on api-gateway and ingestion-worker ONLY
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.rivuletNamespace }}
            app.kubernetes.io/component: backend
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP

    # SRE Agent API for triggering incidents
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.sreNamespace }}
            app.kubernetes.io/name: autosre-agent
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP

    # OpenObserve for querying metrics/logs
    # NOTE: pod uses `app.kubernetes.io/name: open-observe-minimal`
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.openobserveNamespace }}
            app.kubernetes.io/name: open-observe-minimal
      toPorts:
        - ports:
            - port: "5080"
              protocol: TCP

    # External LLM judge API (Gemini/Groq/etc)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
