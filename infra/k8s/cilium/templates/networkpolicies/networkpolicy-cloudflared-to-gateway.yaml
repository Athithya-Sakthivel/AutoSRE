{{- if and .Values.networkPolicies.enabled .Values.networkPolicies.cloudflaredToGateway }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cloudflared-to-gateway
  namespace: {{ .Values.networkPolicies.cloudflaredNamespace | quote }}
spec:
  description: Allow cloudflared pods to make in-cluster HTTP connections used by the Gateway path.
  endpointSelector:
{{ toYaml .Values.networkPolicies.cloudflaredSelector | nindent 4 }}
  egress:
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
{{- end }}
