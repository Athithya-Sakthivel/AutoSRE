{{- if .Values.networkPolicies.enabled }}
# =============================================================================
# Egress: api-gateway, ingestion-worker → postgres, valkey
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: clients-to-datastores-egress
  namespace: {{ .Values.networkPolicies.rivuletNamespace }}
  labels:
    app.kubernetes.io/part-of: autosre-cilium
    app.kubernetes.io/component: network-policy
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - api-gateway
          - ingestion-worker
  egress:
    # → postgres :5432
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.rivuletNamespace }}
            app.kubernetes.io/name: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # → valkey :6379 (NOTE: valkey pod uses `app: valkey`, NOT app.kubernetes.io/name)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.rivuletNamespace }}
            app: valkey
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
# =============================================================================
# Ingress on postgres — who may talk TO postgres
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres-ingress
  namespace: {{ .Values.networkPolicies.rivuletNamespace }}
  labels:
    app.kubernetes.io/part-of: autosre-cilium
    app.kubernetes.io/component: network-policy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  ingress:
    # Application clients: api-gateway, ingestion-worker
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.rivuletNamespace }}
            app.kubernetes.io/name: api-gateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.rivuletNamespace }}
            app.kubernetes.io/name: ingestion-worker
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.sreNamespace }}
            app.kubernetes.io/name: autosre-agent
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # kubelet probes (pg_isready via exec, kept for safety)
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# =============================================================================
# Ingress on valkey — who may talk TO valkey
# NOTE: valkey pod uses `app: valkey`, NOT app.kubernetes.io/name
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: valkey-ingress
  namespace: {{ .Values.networkPolicies.rivuletNamespace }}
  labels:
    app.kubernetes.io/part-of: autosre-cilium
    app.kubernetes.io/component: network-policy
spec:
  endpointSelector:
    matchLabels:
      app: valkey
  ingress:
    # Application clients
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.rivuletNamespace }}
            app.kubernetes.io/name: api-gateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.rivuletNamespace }}
            app.kubernetes.io/name: ingestion-worker
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.sreNamespace }}
            app.kubernetes.io/name: autosre-agent
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # kubelet probes
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
{{- end }}
