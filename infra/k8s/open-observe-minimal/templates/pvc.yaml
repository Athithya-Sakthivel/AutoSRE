apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "open-observe-minimal.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "open-observe-minimal.labels" . | nindent 4 }}
  annotations:
    openobserve.autosre.io/storage-contract: retain
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  volumeMode: Filesystem
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
