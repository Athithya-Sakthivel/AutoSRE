apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel-gateway.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-gateway.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 4
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # MUST be first in every pipeline. Protects the process from OOM.
      memory_limiter:
        check_interval: 2s
        limit_mib: 768
        spike_limit_mib: 192

      # Enriches application telemetry with Kubernetes metadata so that
      # traces and logs can be correlated by pod, namespace, and deployment.
      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.namespace.name
            - k8s.node.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.job.name
            - k8s.cronjob.name
            - k8s.container.name
            - k8s.replicaset.name
          labels:
            - tag_name: app.kubernetes.io/name
              key: app.kubernetes.io/name
              from: pod
            - tag_name: app.kubernetes.io/component
              key: app.kubernetes.io/component
              from: pod
            - tag_name: app.kubernetes.io/part-of
              key: app.kubernetes.io/part-of
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
              - from: resource_attribute
                name: k8s.namespace.name
          - sources:
              - from: connection

      # Drops server-side health-check spans BEFORE they reach OpenObserve.
      # Matches purely on endpoint path — regardless of user agent. This
      # prevents trace table pollution from kubelet probes, agent self-checks,
      # test script curl calls, and Prometheus scrapes.
      filter/drop_health_checks:
        error_mode: ignore
        trace_conditions:
          - >-
            span.kind == SPAN_KIND_SERVER and
            (span.name == "/healthz" or
             span.name == "/readyz" or
             span.name == "/livez" or
             span.name == "/health" or
             span.name == "/ready" or
             span.name == "GET /healthz" or
             span.name == "GET /readyz" or
             span.name == "GET /livez" or
             span.name == "GET /health" or
             span.name == "GET /ready" or
             span.attributes["url.path"] == "/healthz" or
             span.attributes["url.path"] == "/readyz" or
             span.attributes["url.path"] == "/livez" or
             span.attributes["url.path"] == "/health" or
             span.attributes["url.path"] == "/ready" or
             span.attributes["http.route"] == "/healthz" or
             span.attributes["http.route"] == "/readyz" or
             span.attributes["http.route"] == "/livez" or
             span.attributes["http.target"] == "/healthz" or
             span.attributes["http.target"] == "/readyz" or
             span.attributes["http.target"] == "/livez")

      # Drops LangGraph checkpoint INSERT/UPDATE/SELECT spans. These are
      # internal bookkeeping operations that clutter the trace view with
      # dozens of identical DB spans per investigation.
      filter/drop_checkpointer_noise:
        error_mode: ignore
        trace_conditions:
          - >-
            span.kind == SPAN_KIND_CLIENT and
            span.attributes["db.system"] == "postgresql" and
            span.attributes["db.statement"] != nil and
            (IsMatch(span.attributes["db.statement"], ".*checkpoints.*") or
             IsMatch(span.attributes["db.statement"], ".*checkpoint_writes.*") or
             IsMatch(span.attributes["db.statement"], ".*checkpoint_blobs.*"))

      # Defensive filter for application-emitted metrics that collide with
      # namespaces OpenObserve cannot serialize to Parquet.
      filter/drop_openobserve_incompatible:
        error_mode: ignore
        metrics:
          exclude:
            match_type: regexp
            metric_names:
              - "^k8s\\.node\\.memory\\.(major_)?page_faults$"
              - "^k8s\\.node\\.paging\\.faults$"
              - "^container\\.filesystem\\.(available|capacity|usage)$"
              - "^k8s\\.pod\\.filesystem\\.(available|capacity|usage)$"

      # Adds cluster identity to every signal for cross-cluster queries.
      resource/add_cluster:
        attributes:
          - key: cluster.name
            value: "{{ .Values.cluster.name }}"
            action: upsert
          - key: deployment.environment
            value: "production"
            action: upsert

      # Batches signals before export. Positioned last so that the
      # memory_limiter and filters run on individual records, not batches.
      batch:
        send_batch_size: 1024
        send_batch_max_size: 2048
        timeout: 5s

    exporters:
      otlp_http/openobserve:
        endpoint: "{{ .Values.openobserve.endpoint }}"
        headers:
          Authorization: "Basic ${env:OPENOBSERVE_TOKEN}"
        compression: gzip
        timeout: 30s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 2048
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]

      telemetry:
        logs:
          level: info
        metrics:
          readers:
            - periodic:
                interval: 60000
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: "{{ .Values.openobserve.endpoint }}/v1/metrics"
                    headers:
                      - name: "Authorization"
                        value: "Basic ${env:OPENOBSERVE_TOKEN}"

      pipelines:
        traces:
          receivers: [otlp]
          processors:
            - memory_limiter
            - k8s_attributes
            - filter/drop_health_checks
            - filter/drop_checkpointer_noise
            - resource/add_cluster
            - batch
          exporters: [otlp_http/openobserve]

        metrics:
          receivers: [otlp]
          processors:
            - memory_limiter
            - filter/drop_openobserve_incompatible
            - resource/add_cluster
            - batch
          exporters: [otlp_http/openobserve]

        logs:
          receivers: [otlp]
          processors:
            - memory_limiter
            - k8s_attributes
            - resource/add_cluster
            - batch
          exporters: [otlp_http/openobserve]
