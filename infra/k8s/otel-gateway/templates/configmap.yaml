apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel-gateway.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-gateway.labels" . | nindent 4 }}

data:
  config.yaml: |
    receivers:
      # Gateway receives application OTLP telemetry from workloads.
      # gRPC: 4317
      # HTTP/protobuf: 4318
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 4
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # Must run early in every pipeline so the collector protects itself
      # from excessive memory usage before batching/export.
      memory_limiter:
        check_interval: 2s
        limit_mib: 768
        spike_limit_mib: 192

      # Enrich incoming application telemetry with Kubernetes identity.
      # This allows alerting and investigation queries to use pod,
      # namespace, deployment, container, and related Kubernetes fields.
      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.namespace.name
            - k8s.node.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.job.name
            - k8s.cronjob.name
            - k8s.container.name
            - k8s.replicaset.name
          labels:
            - tag_name: app.kubernetes.io/name
              key: app.kubernetes.io/name
              from: pod
            - tag_name: app.kubernetes.io/component
              key: app.kubernetes.io/component
              from: pod
            - tag_name: app.kubernetes.io/part-of
              key: app.kubernetes.io/part-of
              from: pod
        pod_association:
          # Prefer the strongest pod identity when it is already present.
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid

          # Fall back to pod name + namespace when UID is not available.
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
              - from: resource_attribute
                name: k8s.namespace.name

          # Final fallback for telemetry arriving over a network connection.
          - sources:
              - from: connection

      # Remove server-side health-check spans before they reach OpenObserve.
      # This keeps routine Kubernetes probes and health endpoints out of traces.
      filter/drop_health_checks:
        error_mode: ignore
        trace_conditions:
          - >-
            span.kind == SPAN_KIND_SERVER and
            (span.name == "/healthz" or
             span.name == "/readyz" or
             span.name == "/livez" or
             span.name == "/health" or
             span.name == "/ready" or
             span.name == "GET /healthz" or
             span.name == "GET /readyz" or
             span.name == "GET /livez" or
             span.name == "GET /health" or
             span.name == "GET /ready" or
             span.attributes["url.path"] == "/healthz" or
             span.attributes["url.path"] == "/readyz" or
             span.attributes["url.path"] == "/livez" or
             span.attributes["url.path"] == "/health" or
             span.attributes["url.path"] == "/ready" or
             span.attributes["http.route"] == "/healthz" or
             span.attributes["http.route"] == "/readyz" or
             span.attributes["http.route"] == "/livez" or
             span.attributes["http.target"] == "/healthz" or
             span.attributes["http.target"] == "/readyz" or
             span.attributes["http.target"] == "/livez")

      # Remove repetitive PostgreSQL checkpoint bookkeeping spans.
      # These are internal persistence operations rather than useful
      # application-level traces for SRE investigations.
      filter/drop_checkpointer_noise:
        error_mode: ignore
        trace_conditions:
          - >-
            span.kind == SPAN_KIND_CLIENT and
            span.attributes["db.system"] == "postgresql" and
            span.attributes["db.statement"] != nil and
            (IsMatch(span.attributes["db.statement"], ".*checkpoints.*") or
             IsMatch(span.attributes["db.statement"], ".*checkpoint_writes.*") or
             IsMatch(span.attributes["db.statement"], ".*checkpoint_blobs.*"))

      # Defensive metric filter for metric families known to be incompatible
      # with the OpenObserve storage path used by this staging stack.
      filter/drop_openobserve_incompatible:
        error_mode: ignore
        metrics:
          exclude:
            match_type: regexp
            metric_names:
              - "^k8s\\.node\\.memory\\.(major_)?page_faults$"
              - "^k8s\\.node\\.paging\\.faults$"
              - "^container\\.filesystem\\.(available|capacity|usage)$"
              - "^k8s\\.pod\\.filesystem\\.(available|capacity|usage)$"

      # Add cluster-wide identity to every exported signal.
      # The cluster name is supplied by Helm values.
      resource/add_cluster:
        attributes:
          - key: cluster.name
            value: "{{ .Values.cluster.name }}"
            action: upsert
          - key: deployment.environment
            value: "production"
            action: upsert

      # Batch telemetry before export to reduce request overhead.
      batch:
        send_batch_size: 1024
        send_batch_max_size: 2048
        timeout: 5s

    connectors:
      # Logs are explicitly routed to dedicated OpenObserve streams.
      #
      # Default:
      #   app logs -> app_logs
      #
      # PostgreSQL:
      #   container name "postgres" -> postgres_logs
      #
      # Valkey:
      #   container name "valkey" -> valkey_logs
      routing/logs:
        default_pipelines:
          - logs/app
        table:
          - condition: resource.attributes["k8s.container.name"] == "postgres"
            pipelines: [logs/postgres]
          - condition: resource.attributes["k8s.container.name"] == "valkey"
            pipelines: [logs/valkey]

    exporters:
      # Shared exporter for traces and metrics.
      # The OpenObserve endpoint is expected to point at the organization API
      # base configured by the Helm values.
      otlp_http/openobserve:
        endpoint: "{{ .Values.openobserve.endpoint }}"
        headers:
          Authorization: "Basic ${env:OPENOBSERVE_TOKEN}"
        compression: gzip
        timeout: 30s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 2048
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

      # Explicit log-stream exporters.
      # The stream-name header is what keeps the three log classes isolated.
      otlp_http/openobserve_app_logs:
        endpoint: "{{ .Values.openobserve.endpoint }}"
        headers:
          Authorization: "Basic ${env:OPENOBSERVE_TOKEN}"
          stream-name: app_logs
        compression: gzip
        timeout: 30s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 2048
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

      otlp_http/openobserve_postgres_logs:
        endpoint: "{{ .Values.openobserve.endpoint }}"
        headers:
          Authorization: "Basic ${env:OPENOBSERVE_TOKEN}"
          stream-name: postgres_logs
        compression: gzip
        timeout: 30s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 2048
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

      otlp_http/openobserve_valkey_logs:
        endpoint: "{{ .Values.openobserve.endpoint }}"
        headers:
          Authorization: "Basic ${env:OPENOBSERVE_TOKEN}"
          stream-name: valkey_logs
        compression: gzip
        timeout: 30s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 2048
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

    extensions:
      # Exposes the collector health endpoint on port 13133.
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]

      # Export collector self-metrics to OpenObserve.
      # This is collector telemetry, not application metric ingestion.
      telemetry:
        logs:
          level: info
        metrics:
          readers:
            - periodic:
                interval: 60000
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: "{{ .Values.openobserve.endpoint }}/v1/metrics"
                    headers:
                      - name: "Authorization"
                        value: "Basic ${env:OPENOBSERVE_TOKEN}"

      pipelines:
        # Application traces:
        # enrich -> remove health checks/checkpointer noise -> export.
        traces:
          receivers: [otlp]
          processors:
            - memory_limiter
            - k8s_attributes
            - filter/drop_health_checks
            - filter/drop_checkpointer_noise
            - resource/add_cluster
            - batch
          exporters: [otlp_http/openobserve]

        # Application metrics received through OTLP.
        metrics:
          receivers: [otlp]
          processors:
            - memory_limiter
            - filter/drop_openobserve_incompatible
            - resource/add_cluster
            - batch
          exporters: [otlp_http/openobserve]

        # All incoming application logs first enter the routing connector.
        logs/in:
          receivers: [otlp]
          processors:
            - memory_limiter
            - k8s_attributes
            - resource/add_cluster
            - batch
          exporters: [routing/logs]

        # Default application log destination.
        logs/app:
          receivers: [routing/logs]
          processors: [resource/add_cluster, batch]
          exporters: [otlp_http/openobserve_app_logs]

        # PostgreSQL log destination.
        logs/postgres:
          receivers: [routing/logs]
          processors: [resource/add_cluster, batch]
          exporters: [otlp_http/openobserve_postgres_logs]

        # Valkey log destination.
        logs/valkey:
          receivers: [routing/logs]
          processors: [resource/add_cluster, batch]
          exporters: [otlp_http/openobserve_valkey_logs]
