apiVersion: v1
kind: Service
metadata:
  name: {{ include "otel-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-gateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "otel-gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: {{ .Values.service.httpPort }}
      targetPort: otlp-http
      protocol: TCP
