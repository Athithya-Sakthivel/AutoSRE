# =============================================================================
# LOCAL DEVELOPMENT NGINX CONFIGURATION
# =============================================================================
#
# Purpose:
#   - Run inside the frontend container (nginxinc/nginx-unprivileged)
#   - Listen on unprivileged port 8080
#   - Serve built React SPA static files
#   - Proxy API requests to the backend container on the same Docker network
#
# Deployment environment:
#   - Docker Compose or script-based local run
#   - Frontend container: task-api-frontend
#   - Backend container:  task-api-backend (resolvable as "backend" or
#     "task-api-backend" depending on your Docker network and container name)
#
# In the provided app_run.sh, the backend container name is
# "task-api-backend", and NGINX is started after the backend is healthy.
# Therefore we can use either a static upstream or a variable with resolver.
# For robustness against restarts, we use a variable + Docker's embedded DNS.
# =============================================================================

worker_processes auto;                     # Auto-detect available CPU cores
pid /tmp/nginx.pid;                        # Required for unprivileged container

events {
    worker_connections 1024;               # Simultaneous connections per worker
}

http {
    include       /etc/nginx/mime.types;   # Map file extensions to MIME types
    default_type  application/octet-stream;

    # Docker embedded DNS resolver; ensures dynamic resolution of service names
    # 127.0.0.11 is the Docker DNS server inside containers.
    resolver 127.0.0.11 valid=30s ipv6=off;

    sendfile on;                           # Efficient file serving
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;

    client_max_body_size 2m;               # Sufficient for JSON task payloads
    server_tokens off;                     # Hide NGINX version

    gzip on;                               # Compression for text-based responses
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        text/css
        text/plain;

    # Writable temp paths for unprivileged user (UID 101)
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;

    server {
        listen 8080 default_server;        # Unprivileged port
        server_name _;

        root /usr/share/nginx/html;        # Built React files
        index index.html;

        # Basic security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ------------------------------------------------------------------
        # Frontend health endpoint for container healthcheck
        # ------------------------------------------------------------------
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # ------------------------------------------------------------------
        # Proxy API requests to backend using dynamic DNS resolution
        #
        # IMPORTANT:
        #   The `set $backend_upstream http://task-api-backend:8080;` line defines
        #   the target using the backend container/service name.
        #   Because we use a variable in `proxy_pass`, NGINX resolves the
        #   hostname at request time (via Docker DNS), not at startup.
        #   This avoids the "host not found in upstream" error if backend
        #   starts after NGINX.
        # ------------------------------------------------------------------
        location ^~ /api/ {
            set $backend_upstream http://task-api-backend:8080;
            proxy_pass $backend_upstream;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Connection "";
            # Preserve Authorization header (already forwarded by default)

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        # ------------------------------------------------------------------
        # Proxy Actuator health endpoints (liveness/readiness)
        # Keep only health-related; do NOT expose full /actuator
        # ------------------------------------------------------------------
        location = /actuator/health {
            set $backend_upstream http://task-api-backend:8080;
            proxy_pass $backend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }

        location ^~ /actuator/health/ {
            set $backend_upstream http://task-api-backend:8080;
            proxy_pass $backend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }

        # ------------------------------------------------------------------
        # Static assets and SPA fallback
        # ------------------------------------------------------------------
        # index.html should not be cached (so updates are visible)
        location = /index.html {
            expires -1;
            try_files $uri =404;
        }

        # CSS/JS also no-cache in dev (or use content hashes in prod)
        location ~* \.(?:css|js)$ {
            expires -1;
            try_files $uri =404;
        }

        # SPA client-side routing: fallback to index.html for unknown paths
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}