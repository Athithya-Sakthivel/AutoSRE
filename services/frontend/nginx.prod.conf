# =============================================================================
# PRODUCTION NGINX CONFIGURATION (AKS)
# =============================================================================
#
# Environment:
#   - Kubernetes namespace: default (or change accordingly)
#   - Frontend Deployment -> Service "frontend" port 80 -> targetPort 8080
#   - Backend Deployment  -> Service "backend"  port 8080
#   - NGINX Ingress Controller (separate) handles external TLS and routing.
#
# This file runs inside the frontend container. It:
#   - Serves built React SPA
#   - Proxies /api/ and /actuator/health to the backend Service
#   - Uses Kubernetes DNS for dynamic resolution (avoids startup crash if
#     backend Service is not yet ready or restarts)
# =============================================================================

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Kubernetes DNS resolver (typically kube-dns at 10.0.0.10)
    # Adjust IP if your cluster uses a different DNS service IP.
    resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;

    client_max_body_size 1m;              # Enough for JSON task payloads
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        text/css
        text/plain
        image/svg+xml;

    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # ------------------------------------------------------------------
        # Container health endpoint (used by K8s liveness/readiness probes)
        # ------------------------------------------------------------------
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # ------------------------------------------------------------------
        # API proxy to backend Service using dynamic DNS resolution
        # Backend Service: backend:8080 (within same namespace)
        # ------------------------------------------------------------------
        location ^~ /api/ {
            set $backend_upstream http://backend:8080;
            proxy_pass $backend_upstream;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        # ------------------------------------------------------------------
        # Actuator health proxy (only health groups, not full actuator)
        # ------------------------------------------------------------------
        location = /actuator/health {
            set $backend_upstream http://backend:8080;
            proxy_pass $backend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }

        location ^~ /actuator/health/ {
            set $backend_upstream http://backend:8080;
            proxy_pass $backend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }

        # ------------------------------------------------------------------
        # Static asset caching with hashed filenames (immutable)
        # ------------------------------------------------------------------
        location ~* \.(?:css|js|mjs|map|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # index.html must not be cached (so new deploys are reflected)
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}