spring:
  config:
    activate:
      on-profile: test
  cloud:
    azure:
      keyvault:
        secret:
          enabled: false
          property-sources:
            - enabled: false
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:postgresql://localhost:5432/taskdb
    username: taskuser
    password: taskpassword

jwt:
  secret: test-secret-key-for-tests-12345678901234567890
  expiration-ms: 3600000

logging:
  level:
    root: WARN
    com.prod.taskapi: INFO
