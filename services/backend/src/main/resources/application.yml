spring:
  application:
    name: task-api
  datasource:
    url: ${DATABASEURL}
    username: ${DATABASEUSERNAME}
    password: ${DATABASEPASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${HEALTH_SHOW_DETAILS:never}

logging:
  level:
    root: WARN
    org.springframework: WARN
    org.hibernate: WARN
    org.testcontainers: WARN
    com.zaxxer.hikari: WARN
    org.flywaydb: WARN
    com.prod.taskapi: INFO

jwt:
  secret: ${JWTSECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Application Insights connection string is provided by:
#   APPLICATIONINSIGHTS_CONNECTION_STRING environment variable
# No Key Vault dependency since using ESO
