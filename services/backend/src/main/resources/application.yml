spring:
  application:
    name: task-api
  cloud:
    azure:
      keyvault:
        secret:
          property-sources:
            - endpoint: ${AZURE_KEY_VAULT_URI}
  datasource:
    url: ${DatabaseUrl}
    username: ${DatabaseUsername}
    password: ${DatabasePassword}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

  
logging:
  level:
    root: WARN
    org.springframework: WARN
    org.hibernate: WARN
    org.testcontainers: WARN
    com.zaxxer.hikari: WARN
    org.flywaydb: WARN
    com.prod.taskapi: INFO

jwt:
  secret: ${JwtSecret}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

azure:
  key-vault-uri: ${AZURE_KEY_VAULT_URI}

# Application Insights connection string is provided by:
#   spring.cloud.azure.keyvault.secret.property-sources[0]
#   (secret name: ApplicationInsightsConnectionString)
# and is consumed automatically by the Application Insights agent.