parameters:
  - name: imageFullName
    type: string

  - name: serviceName
    type: string

  - name: containerName
    type: string

  - name: namespace
    type: string
    default: "default"

  - name: manifests
    type: string

  - name: aksClusterName
    type: string

  - name: aksResourceGroup
    type: string

  - name: azureSubscription
    type: string

steps:
  - bash: |
      set -euo pipefail

      command -v az
      command -v kubectl
    displayName: "Preflight AKS deployment tooling"

  - task: KubernetesManifest@1
    displayName: "Apply frontend rolling update"
    inputs:
      action: deploy
      connectionType: azureResourceManager
      azureSubscriptionConnection: "${{ parameters.azureSubscription }}"
      azureResourceGroup: "${{ parameters.aksResourceGroup }}"
      kubernetesCluster: "${{ parameters.aksClusterName }}"
      useClusterAdmin: false
      namespace: "${{ parameters.namespace }}"
      rolloutStatusTimeout: "300"
      manifests: "${{ parameters.manifests }}"
      containers: |
        ${{ parameters.containerName }}: ${{ parameters.imageFullName }}
