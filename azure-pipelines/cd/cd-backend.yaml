trigger: none

resources:
  pipelines:
    - pipeline: ciBackend
      source: ci-backend
      trigger:
        branches:
          include:
            - main

variables:
  - group: terraform-vars
  - name: backendNamespace
    value: "default"
  - name: backendManifests
    value: |
      services/backend/k8s/deployment.yaml
      services/backend/k8s/service.yaml
  - name: backendDeploymentManifest
    value: "services/backend/k8s/deployment.yaml"
  - name: backendContainerName
    value: "backend"
  - name: canaryTrafficSplitMethod
    value: "pod"
  - name: k6Endpoint
    value: "/actuator/health/readiness"

pool:
  vmImage: "ubuntu-24.04"

workspace:
  clean: all

stages:
  - stage: build
    displayName: "Build, scan and push backend image"
    condition: and(
      succeeded(),
      eq(variables['resources.pipeline.ciBackend.sourceBranch'], 'refs/heads/main'))
    jobs:
      - job: build_push
        displayName: "Build / Trivy scan / push"
        steps:
          - checkout: self
            clean: true
            fetchDepth: 1
            persistCredentials: false
            submodules: false
            lfs: false

          - bash: |
              set -euo pipefail

              commit='$(resources.pipeline.ciBackend.sourceCommit)'

              test -n "$commit"

              git -c "http.extraheader=AUTHORIZATION: bearer $SYSTEM_ACCESSTOKEN" \
                fetch --no-tags --depth=1 origin "$commit"

              git checkout --detach "$commit"

              test "$(git rev-parse HEAD)" = "$commit"
            displayName: "Checkout exact CI source commit"
            env:
              SYSTEM_ACCESSTOKEN: "$(System.AccessToken)"

          - download: ciBackend
            artifact: ci-attestation

          - bash: |
              set -euo pipefail

              expected='$(resources.pipeline.ciBackend.sourceCommit)'
              attested="$(tr -d '\r\n' < '$(Pipeline.Workspace)/ciBackend/ci-attestation/source-commit.txt')"
              run_id="$(tr -d '\r\n' < '$(Pipeline.Workspace)/ciBackend/ci-attestation/pipeline-run-id.txt')"

              test "$attested" = "$expected"
              test "$run_id" = "$(resources.pipeline.ciBackend.runID)"
            displayName: "Verify CI attestation"

          - template: azure-pipelines/templates/docker-build-push.yaml
            parameters:
              dockerfilePath: "services/backend/Dockerfile"
              contextPath: "services/backend"
              imageRepository: "backend"
              imageTag: "$(resources.pipeline.ciBackend.sourceCommit)"
              sourceCommit: "$(resources.pipeline.ciBackend.sourceCommit)"
              sourcePipelineRunId: "$(resources.pipeline.ciBackend.runID)"
              containerRegistry: "$(containerRegistry)"
              azureSubscription: "azdo-oidc-cd"

  - stage: deploy
    displayName: "Canary deploy backend"
    dependsOn: build
    condition: succeeded()
    jobs:
      - deployment: canary_deploy
        displayName: "Progressive backend canary"
        environment: "staging"
        workspace:
          clean: all
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none

                - checkout: self
                  clean: true
                  fetchDepth: 1
                  persistCredentials: false
                  submodules: false
                  lfs: false

                - bash: |
                    set -euo pipefail

                    commit='$(resources.pipeline.ciBackend.sourceCommit)'

                    test -n "$commit"

                    git -c "http.extraheader=AUTHORIZATION: bearer $SYSTEM_ACCESSTOKEN" \
                      fetch --no-tags --depth=1 origin "$commit"

                    git checkout --detach "$commit"

                    test "$(git rev-parse HEAD)" = "$commit"
                  displayName: "Checkout exact CI source commit"
                  env:
                    SYSTEM_ACCESSTOKEN: "$(System.AccessToken)"

                - download: current
                  artifact: image-metadata

                - bash: |
                    set -euo pipefail

                    metadata='$(Pipeline.Workspace)/image-metadata/image.json'
                    expected_commit='$(resources.pipeline.ciBackend.sourceCommit)'
                    expected_run_id='$(resources.pipeline.ciBackend.runID)'
                    expected_repository='backend'
                    expected_registry='$(containerRegistry)'

                    test -s "$metadata"

                    source_commit="$(jq -er '.sourceCommit' "$metadata")"
                    source_run_id="$(jq -er '.sourcePipelineRunId' "$metadata")"
                    repository="$(jq -er '.repository' "$metadata")"
                    registry="$(jq -er '.registry' "$metadata")"
                    tag="$(jq -er '.tag' "$metadata")"
                    digest="$(jq -er '.digest' "$metadata")"

                    test "$source_commit" = "$expected_commit"
                    test "$source_run_id" = "$expected_run_id"
                    test "$repository" = "$expected_repository"
                    test "$registry" = "$expected_registry"
                    test "$tag" = "$expected_commit"
                    [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

                    image="${registry}.azurecr.io/${repository}@${digest}"

                    echo "Using immutable image digest: $image"
                    echo "##vso[task.setvariable variable=IMAGE_FULL_NAME]$image"
                  displayName: "Verify image provenance and resolve digest"

                - template: azure-pipelines/templates/backend-deploy.yaml
                  parameters:
                    imageFullName: "$(IMAGE_FULL_NAME)"
                    serviceName: "backend"
                    containerName: "$(backendContainerName)"
                    namespace: "$(backendNamespace)"
                    manifests: "$(backendManifests)"
                    deploymentManifest: "$(backendDeploymentManifest)"
                    aksClusterName: "$(aksClusterName)"
                    aksResourceGroup: "$(aksResourceGroup)"
                    azureSubscription: "azdo-oidc-cd"
                    canaryTrafficSplitMethod: "$(canaryTrafficSplitMethod)"
                    canaryPercentages:
                      - 10
                      - 50
                    baselineAndCanaryReplicas: 1
                    k6Script: "azure-pipelines/scripts/k6-load-test.js"
