apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-route
  namespace: task-api
spec:
  parentRefs:
    - name: gateway
      namespace: gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend-stable
          port: 8080
          weight: 100
        - name: backend-canary
          port: 8080
          weight: 0
