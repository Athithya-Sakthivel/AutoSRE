apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: task-api
spec:
  parentRefs:
    - name: gateway
      namespace: gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend-stable
          port: 8080
          weight: 100
        - name: frontend-canary
          port: 8080
          weight: 0
