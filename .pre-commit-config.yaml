
# .pre-commit-config.yaml
#
# Repository hygiene, Python, Go, Java, and frontend hooks.
#
# Go tooling uses `go tool` directives (Go 1.24+) declared in
# workloads/catalog/go.mod. No `go install` step is required;
# versions are resolved from the module's go.sum.
#
# Java requires workloads/orders/mvnw (Maven wrapper).
# Frontend requires Node.js and the project's local ESLint and Prettier.

repos:
  # --- Secrets ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  # --- Repository hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  # --- Python ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 01a675ea018f2fb714478a5ffb83fcea8374bb06 # v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/DetachHead/basedpyright-pre-commit-mirror
    rev: 78e6efd50b63647fecb7e65fc7032745d861e2c5 # 1.39.6
    hooks:
      - id: basedpyright

  # --- Go (workloads/catalog) ---
  #
  # Tools are declared in workloads/catalog/go.mod:
  #
  #   tool (
  #       mvdan.cc/gofumpt
  #       github.com/golangci/golangci-lint/v2/cmd/golangci-lint
  #       golang.org/x/vuln/cmd/govulncheck
  #   )
  #
  # Run `go mod tidy` in workloads/catalog to resolve versions.
  # No manual `go install` is needed; `go tool` resolves from go.sum.
  - repo: local
    hooks:
      - id: go-fumpt
        name: gofumpt
        entry: bash -c 'cd workloads/catalog && go tool gofumpt -w'
        language: system
        files: ^workloads/catalog/.*\.go$

      - id: go-vet
        name: go vet
        entry: bash -c 'cd workloads/catalog && go vet ./...'
        language: system
        files: ^workloads/catalog/.*\.go$
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy
        entry: bash -c 'cd workloads/catalog && go mod tidy'
        language: system
        files: ^workloads/catalog/go\.(mod|sum)$
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'cd workloads/catalog && go tool golangci-lint run --timeout=5m'
        language: system
        files: ^workloads/catalog/.*\.go$
        pass_filenames: false

      - id: govulncheck
        name: govulncheck
        entry: bash -c 'cd workloads/catalog && go tool govulncheck ./...'
        language: system
        files: ^workloads/catalog/go\.(mod|sum)$
        pass_filenames: false

  # --- Java (workloads/orders) ---
  #
  # Requires:
  #   workloads/orders/mvnw
  #   workloads/orders/.mvn/wrapper/*
  #
  # Generate the wrapper once from workloads/orders:
  #   mvn wrapper:wrapper
  - repo: local
    hooks:
      - id: spotless
        name: Spotless (Java)
        entry: bash -c 'cd workloads/orders && ./mvnw -q spotless:check'
        language: system
        files: ^workloads/orders/src/.*\.java$
        pass_filenames: false

  # --- Frontend (workloads/storefront) ---
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (storefront)
        entry: npm --prefix workloads/storefront exec -- eslint --fix
        language: system
        files: ^workloads/storefront/.*\.(js|jsx|ts|tsx)$
        pass_filenames: true

      - id: prettier
        name: Prettier (storefront)
        entry: npm --prefix workloads/storefront exec -- prettier --write
        language: system
        files: ^workloads/storefront/.*\.(js|jsx|ts|tsx|json|css|scss|md)$
        pass_filenames: true
