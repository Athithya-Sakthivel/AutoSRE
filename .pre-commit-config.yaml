repos:
  # Secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  # General repository hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 01a675ea018f2fb714478a5ffb83fcea8374bb06  # v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/DetachHead/basedpyright-pre-commit-mirror
    rev: 78e6efd50b63647fecb7e65fc7032745d861e2c5  # 1.39.6
    hooks:
      - id: basedpyright

  # Frontend ESLint.
  #
  # ESLint 10 requires flat config:
  #   services/frontend/eslint.config.js
  #
  # Uses frontend project's local ESLint.
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (frontend)
        entry: npm --prefix services/frontend exec -- eslint --fix
        language: system
        files: ^services/frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: true

  # Frontend / repository formatting.
  #
  # Uses frontend project's local Prettier.
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: npm --prefix services/frontend exec -- prettier --write
        language: system
        files: ^(services/frontend/.*\.(js|jsx|ts|tsx|json|css|scss|md)|.*\.(md))$
        pass_filenames: true
