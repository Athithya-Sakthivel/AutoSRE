# .pre-commit-config.yaml

repos:
  # --- Secrets ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  # --- Repository hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  # --- Python (AI SRE Agent) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 01a675ea018f2fb714478a5ffb83fcea8374bb06 # v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
        files: ^agents/.*\.py$
      - id: ruff-format
        files: ^agents/.*\.py$

  # --- Go (rivulet/ingestion-worker) ---
  - repo: local
    hooks:
      - id: go-fmt
        name: gofmt (ingestion-worker)
        entry: bash -c 'cd rivulet/ingestion-worker && gofmt -w .'
        language: system
        files: ^rivulet/ingestion-worker/.*\.go$
        pass_filenames: false

      - id: go-vet
        name: go vet (ingestion-worker)
        entry: bash -c 'cd rivulet/ingestion-worker && go vet ./...'
        language: system
        files: ^rivulet/ingestion-worker/.*\.go$
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy (ingestion-worker)
        entry: bash -c 'cd rivulet/ingestion-worker && go mod tidy'
        language: system
        files: ^rivulet/ingestion-worker/go\.(mod|sum)$
        pass_filenames: false

  # --- Java (rivulet/api-gateway) ---
  - repo: local
    hooks:
      - id: spotless
        name: Spotless (api-gateway)
        entry: bash -c 'cd rivulet/api-gateway && ./mvnw -q spotless:check'
        language: system
        files: ^rivulet/api-gateway/src/.*\.java$
        pass_filenames: false

  # --- Frontend (rivulet/frontend + agents/ui) ---
  - repo: local
    hooks:
      - id: prettier-frontend
        name: Prettier (rivulet/frontend)
        entry: npm --prefix rivulet/frontend exec -- prettier --write
        language: system
        files: ^rivulet/frontend/.*\.(js|jsx|ts|tsx|json|css|scss|md)$
        pass_filenames: true

      - id: prettier-agents-ui
        name: Prettier (agents/ui)
        entry: npm --prefix agents/ui exec -- prettier --check
        language: system
        files: ^agents/ui/.*\.(js|jsx|ts|tsx|json|css|scss|md|html|yaml|yml)$
        pass_filenames: true
